<div class="host-centrado">
  <h2 id="subtitulo">Conectarse</h2>
  <form [formGroup]="conexion" #form="ngForm" (submit)="autenticacion.iniciarSesion(conexion)">
    <label>Usuario</label>
    <input type="text" formControlName="usuario">
    <div class="form-erros-container">
      <span *ngIf="usuario?.errors?.['required'] && usuario?.touched && usuario?.invalid">Debe introducir un nome de
        usuario</span>
    </div>

    <label>Contrasinal</label>
    <input type="password" formControlName="contrasinal">
    <div class="form-erros-container">
      <span *ngIf="contrasinal?.errors?.['required'] && contrasinal?.touched && contrasinal?.invalid">Debe introducir un
        contrasinal</span>
    </div>
    <input type="submit" value="Conectarse" [disabled]="!form.valid ? true : false">

  </form>
</div>
