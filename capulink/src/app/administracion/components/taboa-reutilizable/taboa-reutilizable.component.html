<div class="flex justify-center self-center m-auto items-center border w-11/12">
  <div class="flex-col w-11/12 overflow-auto" aria-label="columnas">
    <div class="flex flex-row *:w-60 ">
      <h2 *ngFor="let columna of columnas" class="font-bold text-center min-w-20">{{columna}}</h2>
    </div>
    <div class="flex flex-col" aria-label="celdas">
      <div *ngFor="let celda of celdas" class="flex flex-row *:w-60" aria-label="fila">
        <div *ngFor="let columna of columnas" class="flex flex-row border *:w-20" aria-label="celda">
          <span class="break-words">
            @if(eArray(celda[columna])) {
            <ng-container *ngFor="let valor of celda[columna]" class="">{{valor.titulo}},</ng-container>
            }
            @else {
            {{celda[columna]}}
            }
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
