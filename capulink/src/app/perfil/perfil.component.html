<div class="host-centrado">
  <h1 id="titulo">Perfil de usuario</h1>
</div>
<div>
  <div *ngIf="error">
    Non tes permiso para ver este perfil de usuario
  </div>
  <div class="bio flex flex-col md:flex-row items-start">
    <div *ngIf="name" class="bio-datos self-center md:self-auto md:align-baseline">
      <p class="nome">{{name}}</p>
      <img [src]="foto" class="foto">
    </div>
    <div class="flex flex-col md:mx-6 text-center w-full border rounded">
      <h2 class="text-2xl border-b-2">Ligazóns</h2>
    @for (ligazon of ligazons; track $index) {
      <div>
        <a href="{{ligazon.url}}" class="underline mr-2" target="_blank">{{ligazon.titulo}}</a>
        <a href="{{ligazon.url}}" class="underline mr-2" target="_blank">{{ligazon.url}}</a>
      </div>
      }
    </div>
  </div>

</div>
