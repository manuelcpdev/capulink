<form [formGroup]="formulario" id="form-ligazon">
  <div>
    <label for="titulo">Título</label>
    <input id="titulo" formControlName="titulo" />
  </div>
  <div>
    <label for="url">URL</label>
    <input id="url" formControlName="url" />
  </div>
  <div *ngIf="formulario.get('descripcion')">
    <label for="descripcion">Descripción</label>
    <input id="descripcion" formControlName="descripcion" />
  </div>
  <div *ngIf="formulario.get('etiquetas')">
    <label for="etiquetas">Etiquetas</label>
    <input id="etiquetas" formControlName="etiquetas" />
  </div>
  <div *ngIf="formulario.get('agochado')">
    <label for="agochado">Acochado</label>
    <input type="checkbox" id="agochado" formControlName="agochado" />
  </div>
  <div *ngIf="formulario.get('apropiado')">
    <label for="apropiado">Apropíado</label>
    <input type="checkbox" id="apropiado" formControlName="apropiado" />
  </div>
  <button type="submit" class="boton-xeral-form" [class.boton-habilitado]="formulario.valid" [class.boton-deshabilitado]="formulario.invalid" [disabled]="formulario.invalid">Enviar</button>
  <input type="submit" class="boton-xeral-form" [class.boton-habilitado]="formulario.valid" [class.boton-deshabilitado]="formulario.invalid" [disabled]="formulario.invalid" value="Gardar ligazón">
</form>
