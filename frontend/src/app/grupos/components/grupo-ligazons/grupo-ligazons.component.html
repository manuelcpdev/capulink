<div *ngIf="mostrarLigazons && ligazons.length > 0; else noLigazons" class="flex flex-col">
  <i class="fas fa-window-close boton-pechar absolute self-end top-0 text-2xl text-red-600" (click)="toggleLigazons()"></i>
  <h3 class="text-xl mr-10">Ligazóns do grupo</h3>
  <ul>
    <li *ngFor="let ligazon of ligazons">
      <h3 class="titulo-ligazon">{{ ligazon.titulo }} </h3>
      <a [href]="ligazon.url" target="_blank">{{ ligazon.url }}</a>
      <p>{{ ligazon.descricion }}</p>
    </li>
  </ul>
</div>

<ng-template #noLigazons>
  <div>
    <i class="fas fa-window-close" (click)="toggleLigazons()"></i>
    <p>Non hai ligazóns neste grupo.</p>
  </div>
</ng-template>
